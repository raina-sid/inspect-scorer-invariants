name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # No provider, no network, no sandbox, no model: the suite must stay deterministic offline.
      - name: Tests
        run: pytest -q
      - name: Scorecard
        run: python -m scorecard.summary
      - name: Quickstart example
        run: python examples/quickstart.py
      # Reads the frozen study JSON only -- no inspect_evals, no network -- so the validation
      # result cannot drift without CI going red.
      - name: Validation study audit
        run: python validation/audit_study.py
      - name: Lint
        run: ruff check src scorecard tests examples
      - name: Types
        run: mypy src
