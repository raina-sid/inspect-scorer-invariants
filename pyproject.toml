[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inspect-scorer-probes"
version = "0.1.2"
description = "Metamorphic invariance probes for Inspect AI scoring pipelines"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Siddharth Raina" }]
keywords = ["inspect-ai", "evaluation", "metamorphic-testing", "measurement-validity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
# Floor is the version this was tested against, not a known minimum -- older releases are untested
# and the package reads two private inspect_ai internals defensively.
dependencies = ["inspect-ai>=0.3.266"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[project.urls]
Homepage = "https://github.com/raina-sid/inspect-scorer-probes"
Source = "https://github.com/raina-sid/inspect-scorer-probes"
Issues = "https://github.com/raina-sid/inspect-scorer-probes/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/inspect_scorer_probes"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "scorecard/", "examples/", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests", "scorecard"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# The study harness deliberately catches broad exceptions so a failing cell is RECORDED rather than
# aborting the run, and prints rather than returns.
"validation/*" = ["BLE001", "T201", "E402", "PLR0912", "C901"]

[tool.mypy]
strict = true
